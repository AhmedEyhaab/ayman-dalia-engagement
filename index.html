<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Waiting for our Engagement! 💍</title>
<meta name="description" content="Ayman & Dalia are waiting for their engagement — join the countdown!" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f2e9db;
    --card-bg: #f7f1e6;
    --border: #8a7157;
    --border-soft: #c9b79b;
    --text-dark: #4a3826;
    --text-mid: #75604a;
    --rose: #d97e89;
    --rose-dark: #c56773;
    --beige-btn: #d3c6ac;
    --beige-btn-text: #4a3826;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #f6efe2 0%, var(--bg) 55%, #eee2cf 100%);
    font-family: 'Poppins', sans-serif;
    color: var(--text-dark);
    overflow-x: hidden;
    padding: 40px 16px 80px;
    position: relative;
  }

  .page{
    max-width: 460px;
    margin: 0 auto;
    position: relative;
  }

  /* ---------- decorative branches ---------- */
  .branch{
    position: absolute;
    stroke: var(--border-soft);
    fill: none;
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .branch-right{ top: 60%; right: -60px; width: 110px; height: 260px; }
  .branch-left{ top: -10px; left: -50px; width: 90px; height: 200px; transform: scaleX(-1); opacity: 0.35; }
  @media (max-width: 480px){
    .branch{ display: none; }
  }

  /* ---------- main card ---------- */
  .card{
    position: relative;
    z-index: 1;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 190px 190px 26px 26px;
    padding: 56px 30px 40px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(90, 68, 40, 0.10);
  }

  .rings{
    font-size: 2.1rem;
    line-height: 1;
    margin-bottom: 6px;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
  }

  .script-heading{
    font-family: 'Mrs Saint Delafield', cursive;
    font-weight: 400;
    color: var(--text-dark);
    font-size: clamp(2.3rem, 9vw, 3rem);
    line-height: 1.15;
    margin: 6px 0 18px;
  }
  .script-heading .ring-emoji{
    font-size: 0.65em;
    vertical-align: -0.05em;
  }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    width: 62%;
    margin: 0 auto 20px;
  }
  .divider .line{ flex: 1; height: 1px; background: var(--border-soft); }
  .divider .icon{ color: var(--border); font-size: 0.95rem; }

  .join-text{
    font-size: 1.15rem;
    font-weight: 500;
    margin: 0 0 26px;
  }

  /* ---------- countdown ---------- */
  .countdown{
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .time-box{
    background: transparent;
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 14px 6px 10px;
    width: 72px;
  }
  .time-box span{
    display: block;
    font-size: 1.7rem;
    font-weight: 600;
    color: var(--text-dark);
    font-variant-numeric: tabular-nums;
  }
  .time-box small{
    display: block;
    margin-top: 4px;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: var(--text-mid);
    font-weight: 500;
  }

  /* ---------- buttons ---------- */
  .buttons-row{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-bottom: 26px;
    position: relative;
  }

  .btn-yes{
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    color: #fff;
    background: linear-gradient(135deg, var(--rose), var(--rose-dark));
    border: none;
    border-radius: 30px;
    padding: 14px 38px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(197, 103, 115, 0.38);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .btn-yes:hover{ transform: translateY(-2px); box-shadow: 0 10px 22px rgba(197, 103, 115, 0.48); }
  .btn-yes:active{ transform: translateY(0); }

  .btn-yes:focus-visible, .btn-no:focus-visible{
    outline: 3px solid #8a7157;
    outline-offset: 3px;
  }

  /* the placeholder just reserves the No button's original spot in the layout */
  .no-placeholder{
    width: 118px;
    height: 51px;
    visibility: hidden;
  }

  .btn-no{
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--beige-btn-text);
    background: var(--beige-btn);
    border: none;
    border-radius: 30px;
    padding: 14px 30px;
    cursor: pointer;
    position: fixed;
    z-index: 60;
    transition: left 0.32s cubic-bezier(.2,.9,.3,1.2), top 0.32s cubic-bezier(.2,.9,.3,1.2), transform 0.15s ease;
    box-shadow: 0 6px 14px rgba(90,68,40,0.18);
    white-space: nowrap;
  }
  .btn-no.dodging{ transform: scale(0.94) rotate(-4deg); }

  .small-divider{
    font-size: 0.95rem;
    color: var(--border);
    letter-spacing: 0.2em;
  }

  /* ---------- invite reveal card ---------- */
  .invite-wrap{
    opacity: 0;
    transform: translateY(30px);
    pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s ease;
    margin-top: 54px;
  }
  .invite-wrap.show{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .invite-caption{
    text-align: center;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--text-mid);
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  .invite-image-frame{
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 18px 40px rgba(90, 68, 40, 0.18);
    background: var(--card-bg);
  }

  .invite-image{
    display: block;
    width: 100%;
    height: auto;
  }

  /* ---------- floating hearts ---------- */
  .floating-heart{
    position: fixed;
    top: -8vh;
    pointer-events: none;
    z-index: 200;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes fall{
    to{ transform: translateY(112vh) rotate(340deg); opacity: 0.15; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="page">

    <svg class="branch branch-right" viewBox="0 0 110 260" xmlns="http://www.w3.org/2000/svg">
      <path d="M55 0 C 45 40, 65 70, 55 110 S 45 190, 55 260" stroke-width="1.4"/>
      <g stroke-width="1.1">
        <ellipse cx="38" cy="35" rx="9" ry="4.5" transform="rotate(-35 38 35)"/>
        <ellipse cx="72" cy="55" rx="9" ry="4.5" transform="rotate(35 72 55)"/>
        <ellipse cx="35" cy="95" rx="9" ry="4.5" transform="rotate(-35 35 95)"/>
        <ellipse cx="70" cy="120" rx="9" ry="4.5" transform="rotate(35 70 120)"/>
        <ellipse cx="35" cy="160" rx="9" ry="4.5" transform="rotate(-35 35 160)"/>
        <ellipse cx="70" cy="190" rx="9" ry="4.5" transform="rotate(35 70 190)"/>
        <ellipse cx="38" cy="225" rx="9" ry="4.5" transform="rotate(-35 38 225)"/>
      </g>
    </svg>

    <svg class="branch branch-left" viewBox="0 0 90 200" xmlns="http://www.w3.org/2000/svg">
      <path d="M45 0 C 35 30, 55 55, 45 90 S 35 150, 45 200" stroke-width="1.2"/>
      <g stroke-width="1">
        <ellipse cx="28" cy="28" rx="7" ry="3.5" transform="rotate(-35 28 28)"/>
        <ellipse cx="60" cy="45" rx="7" ry="3.5" transform="rotate(35 60 45)"/>
        <ellipse cx="26" cy="80" rx="7" ry="3.5" transform="rotate(-35 26 80)"/>
        <ellipse cx="58" cy="105" rx="7" ry="3.5" transform="rotate(35 58 105)"/>
      </g>
    </svg>

    <main class="card">
      <div class="rings">💍</div>
      <h1 class="script-heading">Waiting for<br>our Engagement!</h1>

      <div class="divider"><span class="line"></span><span class="icon">♡</span><span class="line"></span></div>

      <p class="join-text">Join us! <span>❤️</span></p>

      <div class="countdown" aria-live="polite">
        <div class="time-box"><span id="days">00</span><small>DAYS</small></div>
        <div class="time-box"><span id="hours">00</span><small>HOURS</small></div>
        <div class="time-box"><span id="minutes">00</span><small>MINUTES</small></div>
        <div class="time-box"><span id="seconds">00</span><small>SECONDS</small></div>
      </div>

      <div class="buttons-row">
        <button class="btn-yes" id="yesBtn">Yes <span>♥</span></button>
        <div class="no-placeholder" id="noPlaceholder"></div>
      </div>

      <div class="divider small-divider-wrap"><span class="line"></span><span class="icon">🌿</span><span class="line"></span></div>
    </main>

    <!-- the real No button floats freely and dodges the cursor/finger -->
    <button class="btn-no" id="noBtn" aria-label="No — this button cannot be pressed">No 🙈</button>

    <div class="invite-wrap" id="inviteWrap">
      <p class="invite-caption">You said yes! Here's the invitation</p>
      <div class="invite-image-frame">
        <img
          class="invite-image"
          src="assets/invitation.jpg"
          alt="Save the date — engagement of Ayman and Dalia, August 29 2026 at 7:00 pm, Egypt View Mokkatam, Latoya Hall"
          loading="lazy"
        />
      </div>
    </div>

  </div>

<script>
  // ---------- Countdown ----------
  // Target: Aug 29, 2026, 7:00 PM — assumed Cairo time (UTC+2).
  // Edit the line below if your local offset is different.
  var target = new Date('2026-08-29T19:00:00+02:00').getTime();

  function pad(n){ return String(n).padStart(2, '0'); }

  function updateCountdown(){
    var now = Date.now();
    var diff = target - now;
    if (diff < 0) diff = 0;

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    var seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = pad(days);
    document.getElementById('hours').textContent = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ---------- Runaway "No" button ----------
  var noBtn = document.getElementById('noBtn');
  var placeholder = document.getElementById('noPlaceholder');
  var hasMoved = false;

  function placeAtStart(){
    if (hasMoved) return;
    var rect = placeholder.getBoundingClientRect();
    noBtn.style.left = rect.left + 'px';
    noBtn.style.top = rect.top + 'px';
  }

  function randomPosition(){
    var w = noBtn.offsetWidth || 120;
    var h = noBtn.offsetHeight || 50;
    var margin = 16;
    var maxX = Math.max(margin, window.innerWidth - w - margin);
    var maxY = Math.max(margin, window.innerHeight - h - margin);
    var x = margin + Math.random() * (maxX - margin);
    var y = margin + Math.random() * (maxY - margin);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
  }

  function dodge(){
    hasMoved = true;
    noBtn.classList.add('dodging');
    randomPosition();
    setTimeout(function(){ noBtn.classList.remove('dodging'); }, 200);
  }

  function distanceToButton(x, y){
    var rect = noBtn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    return Math.hypot(x - cx, y - cy);
  }

  window.addEventListener('load', placeAtStart);
  window.addEventListener('resize', function(){
    if (!hasMoved) placeAtStart();
  });

  document.addEventListener('mousemove', function(e){
    if (distanceToButton(e.clientX, e.clientY) < 95) dodge();
  });

  document.addEventListener('touchmove', function(e){
    var t = e.touches[0];
    if (t && distanceToButton(t.clientX, t.clientY) < 85) dodge();
  }, { passive: true });

  noBtn.addEventListener('touchstart', function(e){
    e.preventDefault();
    dodge();
  }, { passive: false });

  noBtn.addEventListener('click', function(e){
    e.preventDefault();
    dodge();
  });

  // ---------- "Yes" reveal ----------
  var yesBtn = document.getElementById('yesBtn');
  var inviteWrap = document.getElementById('inviteWrap');
  var celebrated = false;

  yesBtn.addEventListener('click', function(){
    inviteWrap.classList.add('show');
    setTimeout(function(){
      inviteWrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 80);
    if (!celebrated){
      celebrated = true;
      launchHearts();
    }
  });

  function launchHearts(){
    var emojis = ['❤️', '💍', '🤍', '💐'];
    for (var i = 0; i < 20; i++){
      (function(){
        setTimeout(function(){
          var el = document.createElement('div');
          el.className = 'floating-heart';
          el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          el.style.left = (Math.random() * 96) + 'vw';
          el.style.fontSize = (16 + Math.random() * 18) + 'px';
          el.style.animationDuration = (2.6 + Math.random() * 2) + 's';
          document.body.appendChild(el);
          setTimeout(function(){ el.remove(); }, 5200);
        }, i * 70);
      })();
    }
  }
</script>
</body>
</html>
